<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VibeSong</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>VibeSong</h1>
    <p class="lead">Tell me how you feel, in your own words. Type it, say it with the 🎤, or add a photo. I'll play a song that matches.</p>

    <form id="vibeForm">
      <label for="feeling" class="visually-hidden">How are you feeling?</label>
      <div class="input-wrap">
        <textarea id="feeling" rows="3"
          placeholder="e.g. Long week, I'm drained but kind of proud of myself"></textarea>
        <button type="button" id="micBtn" class="mic" hidden aria-pressed="false"
          aria-label="Say how you feel" title="Say how you feel">🎤</button>
      </div>
      <p id="micHint" class="hint mic-hint" hidden></p>

      <div class="photo-row">
        <label class="photo-btn" for="photoInput">📷 Add a photo</label>
        <input type="file" id="photoInput" accept="image/*" class="visually-hidden">
        <span class="hint">a selfie, your view, anything that shows the vibe</span>
      </div>
      <div id="photoPreview" class="photo-preview" hidden>
        <img id="photoThumb" alt="Your photo">
        <button type="button" id="photoRemove" class="link-btn">Remove photo</button>
      </div>

      <fieldset class="genres">
        <legend>Music you like <span class="hint">(optional, remembered for next time)</span></legend>
        <div id="genreChips" class="chips"></div>
      </fieldset>

      <label class="option" for="autoSpeak">
        <input type="checkbox" id="autoSpeak">
        <span>Read each match aloud <span class="hint">(always on when you use the 🎤)</span></span>
      </label>

      <button type="submit" id="matchBtn">Match my vibe</button>
    </form>

    <section id="result" class="result" hidden aria-live="polite" aria-labelledby="resultHeading">
      <h2 id="resultHeading" class="visually-hidden" tabindex="-1">Your match</h2>
      <p id="moodLine" class="mood-line"></p>
      <div id="songCard" class="song" hidden>
        <img id="artwork" alt="">
        <div class="song-info">
          <h3 id="songTitle"></h3>
          <p id="songArtist"></p>
          <p id="songSource" class="source"></p>
        </div>
      </div>
      <div id="moodView" class="mood-view" hidden>
        <div id="moodPulse" class="mood-pulse" aria-hidden="true"></div>
        <div class="mood-words">
          <p id="moodCaption" class="mood-caption"></p>
          <p id="moodDescription" class="mood-description"></p>
        </div>
      </div>
      <div class="player-row">
        <audio id="player" controls hidden></audio>
        <button type="button" id="anotherBtn" class="another" hidden>⏭ Another song</button>
      </div>
      <div class="sense-row">
        <button type="button" id="speakBtn" class="sense-btn" hidden>🔊 Read aloud</button>
        <button type="button" id="feelBtn" class="sense-btn" hidden>📳 Feel the mood</button>
      </div>
      <p id="subscribeLine" class="subscribe" hidden>
        Have a subscription? Play the full song in
        <span id="subscribeLinks"></span>
      </p>
      <p id="status" class="status"></p>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
